<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jasa: Bikin Landing Page — JARVIS HUB</title>
  <meta name="description" content="Gw bikinin landing page profesional untuk bisnis kamu. Termasuk desain, copywriting, dan deploy.">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="nav-logo"><span>JARVIS</span> HUB</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="shop.html" class="active">Shop</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
      <div style="display:flex;align-items:center;gap:8px;">
        <a href="cart.html" style="position:relative;display:inline-flex;align-items:center;padding:8px;border-radius:8px;color:var(--text-secondary);">
          &#128722;<span class="cart-badge" style="display:none;position:absolute;top:2px;right:4px;"></span>
        </a>
        <a href="shop.html" style="padding:8px 20px;background:var(--accent);color:white;font-size:0.875rem;font-weight:600;border-radius:8px;text-decoration:none;">Beli Sekarang</a>
        <button style="background:none;border:none;color:var(--text-secondary);cursor:pointer;padding:8px;" onclick="document.querySelector('.mobile-menu').classList.toggle('open')">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="24" height="24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>
  </nav>
  <div class="mobile-menu" style="display:none;position:fixed;top:64px;left:0;right:0;background:var(--bg-secondary);border-bottom:1px solid var(--border);padding:12px;z-index:999;">
    <a href="index.html" style="display:block;padding:12px 16px;color:var(--text-secondary);font-size:1rem;text-decoration:none;border-radius:8px;" onclick="this.closest('.mobile-menu').style.display='none'">Home</a>
    <a href="blog.html" style="display:block;padding:12px 16px;color:var(--text-secondary);font-size:1rem;text-decoration:none;border-radius:8px;" onclick="this.closest('.mobile-menu').style.display='none'">Blog</a>
    <a href="shop.html" style="display:block;padding:12px 16px;color:var(--text-secondary);font-size:1rem;text-decoration:none;border-radius:8px;" onclick="this.closest('.mobile-menu').style.display='none'">Shop</a>
    <a href="about.html" style="display:block;padding:12px 16px;color:var(--text-secondary);font-size:1rem;text-decoration:none;border-radius:8px;" onclick="this.closest('.mobile-menu').style.display='none'">About</a>
    <a href="cart.html" style="display:block;padding:12px 16px;color:var(--text-secondary);font-size:1rem;text-decoration:none;border-radius:8px;" onclick="this.closest('.mobile-menu').style.display='none'">&#128722; Keranjang</a>
  </div>
  <div id="page-content"></div>
  <footer class="footer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-brand"><div class="logo"><span>JARVIS</span> HUB</div><p>Platform belajar, templat, dan jasa pembuatan website.</p></div>
        <div><h4 style="font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-primary);margin-bottom:12px;">Navigasi</h4><ul style="list-style:none;"><li style="margin-bottom:6px;"><a href="index.html" style="color:var(--text-secondary);font-size:0.85rem;text-decoration:none;">Home</a></li><li style="margin-bottom:6px;"><a href="shop.html" style="color:var(--text-secondary);font-size:0.85rem;text-decoration:none;">Shop</a></li></ul></div>
        <div><h4 style="font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-primary);margin-bottom:12px;">Produk</h4><ul style="list-style:none;"><li style="margin-bottom:6px;"><a href="shop.html" style="color:var(--text-secondary);font-size:0.85rem;text-decoration:none;">Shop</a></li></ul></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding-top:20px;border-top:1px solid var(--border);font-size:0.8rem;color:var(--text-muted);"><span>&#169; 2025 JARVIS HUB</span></div>
    </div>
  </footer>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var main = document.getElementById('page-content');
      var p = {"id": "prod-4", "name": "Jasa: Bikin Landing Page", "desc": "Gw bikinin landing page profesional untuk bisnis kamu. Termasuk desain, copywriting, dan deploy.", "price": 500000, "originalPrice": 750000, "category": "jasa", "rating": 5.0, "reviews": 32, "badge": "PREMIUM", "features": ["Desain custom sesuai brand", "Copywriting included", "Responsive mobile & desktop", "SEO basic setup", "Deploy ke Vercel/Netlify", "Revisi 2x gratis", "Garansi 30 hari"]};
      var discount = 33;
      var waMsg = Halo%2C%20gw%20tertarik%20sama%20%27Jasa%3A%20Bikin%20Landing%20Page%27%20seharga%20Rp%20500K.%20Bisa%20info%20lebih%20lanjut%3F;
      
      var featuresLi = p.features.map(function(f) { return '            <li>' + f + '</li>\n'; }).join('');
      var badgeHtml = p.badge ? '          <span style="display:inline-block;padding:4px 12px;background:var(--accent);color:white;font-size:0.7rem;font-weight:700;border-radius:20px;margin:12px 0;">' + p.badge + '</span>\n' : '';
      var origHtml = p.originalPrice ? '              <span class="original">' + fmtPrice(p.originalPrice) + '</span>\n              <span class="discount-badge">-' + discount + '%</span>\n' : '';
      
      main.innerHTML = \x60
        <div class="container">
          <div class="breadcrumb">
            <a href="shop.html">Shop</a>
            <span class="separator">&rsaquo;</span>
            <span class="current">\${p.name}</span>
          </div>
          
          <div class="product-detail">
            <div>
              <div class="product-image-large">\${p.typeLabel.split(' ')[0]}</div>
              
              <div style="margin-top:20px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;">
                <h3 style="font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-primary);margin-bottom:10px;">Deskripsi</h3>
                <p style="color:var(--text-secondary);line-height:1.7;">\${p.description}</p>
              </div>
            </div>
            
            <div class="product-info">
              <span class="type-badge">\${p.typeLabel}</span>
              <h1>\${p.name}</h1>
              
              <div class="rating-display">
                <span>&#9733;&#65039;</span>
                <span style="font-weight:600;color:var(--text-primary);">\${p.rating}</span>
                <span class="text-muted">(\${p.reviews} review)</span>
              </div>
              
              <div class="price-display">
                <span class="current">\${fmtPrice(p.price)}</span>
                \${origHtml}
              </div>
              
              \${badgeHtml}
              
              <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin:16px 0;">
                <h3 style="font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-primary);margin-bottom:12px;">Yang Kamu Dapat</h3>
                <ul class="features-list">\${featuresLi}</ul>
              </div>
              
              <div style="display:flex;flex-direction:column;gap:10px;">
                <button class="btn btn-primary btn-lg btn-block" onclick="Cart.addItem(p);showToast('\u2705 Ditambahkan ke keranjang!');">
                  &#128722; Tambah ke Keranjang
                </button>
                <button class="btn btn-secondary btn-block" onclick="window.open('https://wa.me/?text=\${waMsg}', '_blank')">
                  &#128172; Chat via WhatsApp
                </button>
              </div>
              
              <div class="trust-badges">
                <div class="trust-badge"><div class="icon">&#128274;</div><div class="label">Pembayaran Aman</div></div>
                <div class="trust-badge"><div class="icon">&#9889;</div><div class="label">Instant Download</div></div>
                <div class="trust-badge"><div class="icon">&#128172;</div><div class="label">Support 24/7</div></div>
              </div>
            </div>
          </div>
        </div>
      \x60;
    });
  </script>
</body>
</html>
